services:
  # 1. Relational Database: MySQL 8.0
  mysql:
    image: mysql:8.0
    container_name: science_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: grade8_science
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  # 2. Vector Database: Qdrant
  qdrant:
    image: qdrant/qdrant:latest
    container_name: science_qdrant
    restart: always
    ports:
      - "6333:6333" # REST API & Web Dashboard
      - "6334:6334" # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  mysql_data:
  qdrant_data:
